name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Create archive
        run: |
          tar czf "os-tracker-${{ matrix.target }}.tar.gz" \
            -C "target/${{ matrix.target }}/release" os-tracker
          shasum -a 256 "os-tracker-${{ matrix.target }}.tar.gz" \
            > "os-tracker-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: os-tracker-${{ matrix.target }}
          path: os-tracker-${{ matrix.target }}.*

  universal:
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: os-tracker-*-apple-darwin

      - name: Create Universal Binary
        run: |
          mkdir -p x86 arm
          tar xzf os-tracker-x86_64-apple-darwin/os-tracker-x86_64-apple-darwin.tar.gz -C x86
          tar xzf os-tracker-aarch64-apple-darwin/os-tracker-aarch64-apple-darwin.tar.gz -C arm
          lipo -create -output os-tracker x86/os-tracker arm/os-tracker
          tar czf os-tracker-macos.tar.gz os-tracker
          shasum -a 256 os-tracker-macos.tar.gz > os-tracker-macos.tar.gz.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: os-tracker-macos
          path: os-tracker-macos.*

  deb:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo install cargo-deb
      - run: cargo deb --target x86_64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: os-tracker-deb
          path: target/x86_64-unknown-linux-musl/debian/*.deb

  release:
    needs: [build, universal, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            os-tracker-*/os-tracker-*.*
            os-tracker-deb/*.deb
